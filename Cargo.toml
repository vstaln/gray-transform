[package]
name = "gray-transform"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Rewrite or intercept submitted input (?quick/?verbose prefixes, ping/time, custom rules). Port of pi's input-transform."

[[bin]]
name = "gray-transform"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
